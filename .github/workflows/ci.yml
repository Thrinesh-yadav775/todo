name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start server and health check
        run: |
          node server.js &
          sleep 3
          curl -f http://localhost:3000 || exit 1
          curl -f http://localhost:3000/api/todos || exit 1

      - name: Build Docker image
        run: docker build -t todo-app .

      - name: Run Docker container and health check
        run: |
          docker run -d -p 8080:3000 --name todo-test todo-app
          sleep 3
          curl -f http://localhost:8080 || exit 1
          curl -f http://localhost:8080/api/todos || exit 1
          docker stop todo-test
