name: CD

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERUSRENAME }}
          password: ${{ secrets.DOCKERPASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERUSRENAME }}/todo-app:latest

      - name: Verify Pushed Image
        run: docker pull ${{ secrets.DOCKERUSRENAME }}/todo-app:latest
